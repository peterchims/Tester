worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream techtester_api {
    server api:4100;
  }

  upstream techtester_web {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    # Real client IP/proto for both upstreams, since neither ever sees the
    # internet directly.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API — matched first so it isn't shadowed by the web app's catch-all `/`.
    location /v1/ {
      proxy_pass http://techtester_api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';

      # /v1/scans/:id/events streams Server-Sent Events. Buffering would hold
      # every progress event back until the whole response closes, and the
      # default read timeout would kill the connection mid-scan.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location = /health {
      proxy_pass http://techtester_api/health;
    }

    # Everything else — the Next.js app.
    location / {
      proxy_pass http://techtester_web;
      proxy_http_version 1.1;
    }
  }
}

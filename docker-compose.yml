services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quality
      POSTGRES_USER: quality
      POSTGRES_PASSWORD: quality
    ports: ["5432:5432"]
    volumes: [quality-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql://quality:quality@postgres:5432/quality
      API_PORT: 4100
      CORS_ORIGIN: http://localhost:3000
    ports: ["4100:4100"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  dashboard:
    build:
      context: .
      dockerfile: infra/dashboard.Dockerfile
      args: {NEXT_PUBLIC_API_URL: http://localhost:4100}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  quality-data:
